<!DOCTYPE html>
<html lang="ko">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> 상품 등록 </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <h2 class="text-center mb-4">제품 등록</h2>
            
            <div class="row">
            <div class="mb-3 col-md-6">
                <select class="form-select" aria-label="Default select example">
            <option selected>카테고리</option>
            <option value="1">디지털기기</option>
            <option value="2">가구</option>
            <option value="3">기전</option>
            <option value="4">기전</option>
            <option value="5">기전</option>
            <option value="6">기전</option>
    </select>
    </div>

    <div class="row">
    <div class="mb-3 col-md-6">
            <label for="exampleFormControlInput1" class="form-label">제품명</label>
            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="제품명을 입력해주세요.">
            </div>

            <div class="row">
            <div class="mb-3"col-12>
            <label for="exampleFormControlTextarea1" class="form-label">제품 설명</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" placeholder="제품에 대한 설명을 입력해주세요." rows="3"></textarea>
            </div>
        </div>
        <div class="mb-3">
  <label for="formFileMultiple" class="form-label">제품 사진 등록</label>
  <input class="form-control" type="file" id="formFileMultiple" multiple>
</div>
        </div>
    </body>
</html>
