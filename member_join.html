<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>회원가입</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script>
    function FindZip()
    {
        window.open(
            "zipcode.php",
            "zip",
            "width=440,height=320,scrollbars=no"
        );
    }
</script>
</head>


<body>
    <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <h2 class="text-center mb-4">회원가입</h2>

            <form name="form2">
                <div class="mb-3">
    <label for="user_id" class="form-label">아이디</label>

    <div class="input-group">
        <input
            type="text"
            name="id"
            id="user_id"
            class="form-control"
            placeholder="아이디를 입력해주세요."
        >

        <button type="button" class="btn btn-outline-secondary">
            중복 확인
        </button>
    </div>
</div>

<!-- 비밀번호 입력 -->
<div class="mb-3">
  <label for="user_pwd" class="form-label">비밀번호</label>
  <input type="password" class="form-control" name="pwd" id="user_pwd" placeholder="비밀번호를 입력해주세요.">
</div>

<!-- 비밀번호 확인 -->
<div class="mb-3">
  <label for="user_pwd1" class="form-label">비밀번호 확인</label>
  <input type="password" class="form-control" name="pwd1" id="user_pwd1" placeholder="비밀번호를 한번더 입력해주세요.">
</div>

<!-- 이름 입력 -->
<div class="row mb-3">
  <div class="col">
     <label for="user_name" class="form-label">이름</label>
    <input type="text" name="name" id="user_name" class="form-control" placeholder="이름을 입력해주세요.">
  </div>
</div>

<!-- 휴대폰 -->
<div class="mb-3">
    <label class="form-label">휴대폰</label>

    <div class="d-flex align-items-center gap-2">
        <input
            type="text"
            name="tel1"
            class="form-control"
            maxlength="3"
            inputmode="numeric"
            placeholder=""
            aria-label="앞자리"
            style="max-width: 60px;"
        >

        

        <input
            type="text"
            name="tel2"
            class="form-control"
            maxlength="4"
            inputmode="numeric"
            placeholder=""
            aria-label="중간자리"
            style="max-width: 80px;"
        >

        

        <input
            type="text"
            name="tel3"
            class="form-control"
            maxlength="4"
            inputmode="numeric"
            placeholder=""
            aria-label="뒤자리"
            style="max-width: 80px;"
        >
    </div>
</div>

<!-- 이메일 입력-->
    <div class="mb-3">
    <label for="user_email" class="form-label">이메일</label>

    <input
        type="email"
        name="email"
        id="user_email"
        class="form-control"
        placeholder="이메일을 입력해주세요."
    >
</div>


<!-- 생년월일 -->
<div class="mb-3">
    <label class="form-label">생년월일</label>

    <div class="d-flex align-items-center gap-2">
        <input
            type="text"
            name="birthday1"
            class="form-control"
            maxlength="4"
            inputmode="numeric"
            placeholder="연도"
            aria-label="출생 연도"
            style="max-width: 100px;"
        >

        <span>-</span>

        <input
            type="text"
            name="birthday2"
            class="form-control"
            maxlength="2"
            inputmode="numeric"
            placeholder="월"
            aria-label="출생 월"
            style="max-width: 80px;"
        >

        <span>-</span>

        <input
            type="text"
            name="birthday3"
            class="form-control"
            maxlength="2"
            inputmode="numeric"
            placeholder="일"
            aria-label="출생 일"
            style="max-width: 80px;"
        >
    </div>
</div>

<!-- 주소 입력 -->
<div class="mb-3">
    <label for="user_address" class="form-label">주소</label>

    <div class="input-group">
        <input
            type="text"
            name="juso"
            id="user_address"
            class="form-control"
            placeholder="주소를 검색해주세요."
            readonly
        >

        <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="FindZip()"
        >
            주소 검색
        </button>
    </div>

    <input
        type="text"
        name="juso3"
        class="form-control mt-2"
        placeholder="상세 주소를 입력해주세요."
    >
</div>
<div class="text-center">
    <button type="button" class="btn btn-dark">
        회원가입
    </button>
</div>
            </form>

        </div>
    </div>
</div>
</body>

</html>
