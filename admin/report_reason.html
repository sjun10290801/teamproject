<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>신고 상세보기</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .report-container {
            max-width: 900px;
            margin: 60px auto;
        }

        .report-card {
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .report-header {
            padding: 20px 25px;
            border-bottom: 1px solid #dee2e6;
            background-color: #fff5f5;
        }

        .report-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .report-body {
            padding: 30px;
        }

        .info-title {
            font-weight: 600;
            color: #555;
        }

        .detail-box {
            margin-top: 10px;
            padding: 20px;
            min-height: 150px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            line-height: 1.7;
        }

    </style>
</head>

<body>

<div class="container report-container">

    <div class="report-card">
        <div class="report-header">
            <h3>
                신고 상세보기
            </h3>
        </div>

        <div class="report-body">

            <div class="mb-4">

                <div class="row mb-3">
                    <div class="col-md-3 info-title">
                        신고번호
                    </div>
                    <div class="col-md-9">
                        123
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-3 info-title">
                        신고자 아이디
                    </div>
                    <div class="col-md-9">
                        user01
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-3 info-title">
                        피신고자 아이디
                    </div>
                    <div class="col-md-9">
                        user02
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 info-title">
                        신고사유
                    </div>
                    <div class="col-md-9">
                            욕설 및 비방
                        </span>
                    </div>
                </div>
            </div>

            <hr>

            <div class="mt-4">

                <h5 class="fw-bold mb-3">
                    상세사유
                </h5>

                <div class="detail-box">
                    거래 과정에서 부적절한 언어를 사용하여
                    신고합니다.
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-4 border-top">

                <button type="button"
                        class="btn btn-dark">
                    반려
                </button>

                <button type="button"
                        class="btn btn-danger">
                    제재
                </button>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
