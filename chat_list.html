<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅방 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <section class="card shadow-sm">
                    <div class="card-header bg-white p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <strong>채팅방 목록</strong>
                            <span class="text-secondary">2개의 채팅방</span>
                        </div>
                    </div>

                    <div class="list-group list-group-flush">
                        <a href="chat_room.html" class="list-group-item list-group-item-action p-3">
                            <div class="d-flex align-items-center gap-3">
                                <!-- 프로필 사진 -->
                                <img src="images/default_profile.jpg" alt="프로필 사진"
                                    class="rounded-circle object-fit-cover border" style="width: 60px; height: 60px;">

                                <div class="flex-grow-1">
                                    <!-- 상대방 이름, 메시지 수 -->
                                    <div class="d-flex w-100 justify-content-between align-items-center ">
                                        <h5 class="mb-1">허유정</h5>

                                        <span class="badge text-bg-primary rounded-pill">
                                            2
                                        </span>
                                    </div>

                                    <!-- 상품명 -->
                                    <p class="small text-secondary mb-1">
                                        로지텍 G903 무선 게이밍 마우스
                                    </p>

                                    <!-- 마지막 메시지, 마지막 시간 -->
                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                        <p class="mb-0 text-secondary">
                                            네 반갑습니다.
                                        </p>

                                        <small class="text-secondary">
                                            3시간 전
                                        </small>
                                    </div>

                                </div>
                            </div>
                        </a>



                        <a href="chat_room.html" class="list-group-item list-group-item-action p-3">
                            <div class="d-flex align-items-center gap-3">
                                <!-- 프로필 사진 -->
                                <img src="images/default_profile.jpg" alt="프로필 사진"
                                    class="rounded-circle object-fit-cover border" style="width: 60px; height: 60px;">

                                <div class="flex-grow-1">
                                    <!-- 상대방 이름, 메시지 수 -->
                                    <div class="d-flex w-100 justify-content-between align-items-center ">
                                        <h5 class="mb-1">정공성</h5>

                                        <span class="badge text-bg-primary rounded-pill">
                                            14
                                        </span>
                                    </div>

                                    <!-- 상품명 -->
                                    <p class="small text-secondary mb-1">
                                        농구공
                                    </p>

                                    <!-- 마지막 메시지, 마지막 시간 -->
                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                        <p class="mb-0 text-secondary">
                                            미안합니다.
                                        </p>

                                        <small class="text-secondary">
                                            18일 전
                                        </small>
                                    </div>

                                </div>
                            </div>
                        </a>
                    </div>
                </section>
            </div>
        </div>
    </div>
</body>

</html>
